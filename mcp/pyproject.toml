[project]
name = "enrichment-mcp"
version = "2.1.0"
description = "Structured lead-gen & enrichment MCP for a software dev / automation / website business"
readme = "README.md"
authors = [
    { name = "Rizwan-090505", email = "rizzwanabdullah@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "crawlee[playwright]>=1.10.0",
    "mcp[cli]>=2.1.1",
    "python-dotenv>=1.2.3",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
]

[project.scripts]
enrichment-mcp = "enrichment_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
