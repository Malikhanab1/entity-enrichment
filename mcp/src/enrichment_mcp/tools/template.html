<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">

<title>Cognivelle</title>

<style>
:root {
    color-scheme: light dark;
    supported-color-schemes: light dark;
}

body,
table,
td,
a {
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
}

table,
td {
    mso-table-lspace: 0pt;
    mso-table-rspace: 0pt;
}

img {
    -ms-interpolation-mode: bicubic;
    border: 0;
    height: auto;
    line-height: 100%;
    outline: none;
    text-decoration: none;
}

table {
    border-collapse: collapse !important;
}

body {
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
}

/* Buttons */

.cta-button:hover {
    background-color: #c2185b !important;
}

.cta-secondary:hover {
    background-color: rgba(233, 30, 99, 0.05) !important;
}

.sig-link:hover {
    color: #c2185b !important;
}


/* Mobile */

@media screen and (max-width: 600px) {

    .btn-container {
        display: block !important;
        width: 100% !important;
        margin-bottom: 12px !important;
    }

    .btn-container a {
        display: block !important;
    }

    .plans-table,
    .plans-table tbody,
    .plans-table tr {
        display: block !important;
        width: 100% !important;
    }

    .plan-col {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 0 12px 0 !important;
        box-sizing: border-box !important;
    }

    .plan-col.last {
        padding-bottom: 0 !important;
    }

    .plan-col table {
        width: 100% !important;
    }

    .plan-card,
    .plan-card-pro {
        width: 100% !important;
        height: auto !important;
        min-height: 100px !important;
        box-sizing: border-box !important;
    }
}


/* Dark mode */

@media (prefers-color-scheme: dark) {

    body,
    .outer-wrap {
        background-color: #121212 !important;
    }

    .email-card {
        background-color: #1e1e1e !important;
        border-color: #333333 !important;
    }

    p,
    td,
    span,
    li,
    div {
        color: #e0e0e0 !important;
    }

    h2,
    h3,
    strong {
        color: #ffffff !important;
    }

    .text-muted {
        color: #a0a0a0 !important;
    }

    .divider {
        border-top-color: #333333 !important;
    }

    .logo-shield {
        background-color: #ffffff !important;
        padding: 12px !important;
        border-radius: 6px !important;
    }

    .plan-card {
        background-color: #2a2a2a !important;
        border-color: #333333 !important;
    }

    .plan-card-pro {
        background-color: #3b1c28 !important;
        border-color: #E91E63 !important;
    }

    .cta-secondary {
        border-color: #E91E63 !important;
        color: #ff6090 !important;
    }

    .cta-secondary:hover {
        background-color: rgba(233, 30, 99, 0.15) !important;
    }
}
</style>
</head>


<body style="
    margin:0;
    padding:0;
    background-color:#f9f9fa;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:#333333;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
">


<table
    role="presentation"
    class="outer-wrap"
    cellspacing="0"
    cellpadding="0"
    border="0"
    width="100%"
    bgcolor="#f9f9fa"
>

<tr>

<td align="center" style="padding:40px 16px;">


<table
    role="presentation"
    class="email-card"
    cellspacing="0"
    cellpadding="0"
    border="0"
    width="100%"
    style="
        max-width:600px;
        background-color:#ffffff;
        border:1px solid #eaeaea;
        border-top:4px solid #E91E63;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 8px 24px rgba(0,0,0,0.04);
    "
>


<!-- Logo -->

<tr>

<td align="center" style="padding:48px 40px 32px;">

<img
    src="https://cognivelle.com/images/cognivelle_email.png"
    alt="Cognivelle"
    width="160"
    class="logo-shield"
    style="
        display:block;
        border:0;
        width:160px;
        max-width:100%;
    "
>

</td>

</tr>


<!-- Main content -->

<tr>

<td style="
    padding:0 48px 40px;
    font-size:16px;
    line-height:1.6;
    color:#333333;
">


<!-- Heading -->

<h2 style="
    margin-top:0;
    margin-bottom:16px;
    color:#111827;
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.5px;
">
    
</h2>


<!-- Greeting -->

<p style="margin:0 0 16px 0;">
    
</p>


<!-- Opening -->

<p style="margin:0 0 16px 0;">

</p>


<!-- Cognivelle introduction -->

<p style="margin:0 0 28px 0;">

</p>


<!-- Closing -->

<p style="margin:0 0 28px 0;">

</p>


<!-- CTA -->

<table
    role="presentation"
    cellspacing="0"
    cellpadding="0"
    border="0"
    width="100%"
    style="margin-bottom:40px;"
>

<tr>

<td align="left">


<!-- Calendly -->

<table
    role="presentation"
    cellspacing="0"
    cellpadding="0"
    border="0"
    class="btn-container"
    style="
        display:inline-block;
        margin-right:12px;
    "
>

<tr>

<td
    align="center"
    style="
        border-radius:6px;
        background-color:#E91E63;
    "
>

<a
    href="https://calendly.com/hello-cognivelle"
    class="cta-button"
    target="_blank"
    style="
        display:inline-block;
        padding:14px 28px;
        color:#ffffff;
        text-decoration:none;
        font-weight:600;
        font-size:15px;
        border-radius:6px;
        transition:background-color 0.2s ease;
    "
>

Schedule a Call

</a>

</td>

</tr>

</table>


<!-- Reply -->

<table
    role="presentation"
    cellspacing="0"
    cellpadding="0"
    border="0"
    class="btn-container"
    style="display:inline-block;"
>

<tr>

<td
    align="center"
    style="
        border-radius:6px;
        background-color:transparent;
        border:2px solid #E91E63;
    "
>

<a
    href="mailto:hello@cognivelle.com?subject=Exploring%20Digital%20Automations"
    class="cta-secondary"
    style="
        display:inline-block;
        padding:12px 26px;
        color:#E91E63;
        text-decoration:none;
        font-weight:600;
        font-size:15px;
        border-radius:4px;
        transition:background-color 0.2s ease;
    "
>

Or reply to this note

</a>

</td>

</tr>

</table>


</td>

</tr>

</table>


<!-- Divider -->

<table
    role="presentation"
    cellspacing="0"
    cellpadding="0"
    border="0"
    width="100%"
    style="margin-bottom:28px;"
>

<tr>

<td
    class="divider"
    height="1"
    style="border-top:1px solid #eaeaea;"
></td>

</tr>

</table>


<!-- Footer / Signature -->

<table
    role="presentation"
    cellspacing="0"
    cellpadding="0"
    border="0"
>

<tr>

<td>


<p style="
    margin:0;
    font-size:16px;
    font-weight:600;
    color:#111827;
">

[FROM_NAME]

</p>


<p
    class="text-muted"
    style="
        margin:4px 0 0 0;
        font-size:14px;
        color:#6b7280;
    "
>

Digital Infrastructure Consultant

</p>


<p style="
    margin:8px 0 0 0;
    font-size:14px;
    font-weight:500;
">

<a
    href="https://cognivelle.com"
    class="sig-link"
    style="
        color:#E91E63;
        text-decoration:none;
        transition:color 0.2s;
    "
>

cognivelle.com

</a>

</p>


</td>

</tr>

</table>


</td>

</tr>


</table>


</td>

</tr>

</table>


</body>
</html>
