[project]
name = "finetuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rizwan-090505", email = "rizzwanabdullah@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "fastapi>=0.111.0",
    "gguf>=0.19.0",
    "peft>=0.20.0",
    "pydantic>=2.0.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
finetuning = "finetuning:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
